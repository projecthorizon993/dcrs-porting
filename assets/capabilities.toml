# Capability registry
#
# Which third-party mod APIs a native Discord client can replicate.
#
# Surface ids follow `dcrs-compat::registry`. Classes:
#   read | write | subscription | ui  -> replicable
#   internals                                -> NOT replicable (depends on the minified bundle)
#
# `support` is one of: stub | partial | implemented | unsupported.
# `unsupported` is only legal on `internals` surfaces; the loader rejects it elsewhere.
#
# Counts follow the source survey in docs/porting.md: 71 Flux stores and ~400 getters in
# Vencord.Webpack.Common, ~4000 legal Flux action names of which mods dispatch ~25, and 17
# BdApi members. Only the surfaces mods demonstrably touch are enumerated here; the registry is
# expected to grow as more plugins are analyzed.

version = 1

# ---------------------------------------------------------------------------
